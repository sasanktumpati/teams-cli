[package]
name = "teams-cli"
version = "0.3.4"
edition = "2021"
rust-version = "1.89"
description = "Durable local archive, CLI, and authenticated loopback HTTP API for the Microsoft Teams (v2) desktop cache on macOS"
repository = "https://github.com/sasanktumpati/teams-cli"
readme = "README.md"
keywords = ["teams", "microsoft-teams", "sqlite", "cli", "archive"]
categories = ["command-line-utilities", "database"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/src/**",
]

[lib]
name = "teams_cli"
path = "src/lib.rs"

[[bin]]
name = "teams"
path = "src/main.rs"

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
ctrlc = { version = "3.4", features = ["termination"] }
flate2 = "1.0"
getrandom = "0.2"
hex = "0.4"
hmac = "0.12"
jiff = "1.0"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
pulldown-cmark = { version = "0.12", default-features = false }
regex = "1.11"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
snap = "1.1"
tempfile = "3.13"
ureq = { version = "2.10", default-features = false, features = ["tls", "native-certs", "gzip"] }
url = "2.5"
xz2 = "0.1"

[dev-dependencies]
tiny_http = "0.12"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[profile.release.package.libsqlite3-sys]
opt-level = 3

[profile.release.package.lzma-sys]
opt-level = 3
